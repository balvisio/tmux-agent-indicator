# tmux-agent-indicator configuration. Installed by install.sh as ~/.tmux/agent-indicator.conf and
# sourced from ~/.tmux.conf. Do not edit: the installer overwrites it on update. Put your changes in
# ~/.tmux/agent-indicator.local.conf, loaded at the end of this file and never touched by the installer.

# Homebrew tmux on macOS: a server started by a GUI terminal has a bare PATH.
if-shell '[ -d /opt/homebrew/bin ]' 'set-environment -g PATH "/opt/homebrew/bin:$PATH"'

run-shell ~/.tmux/plugins/tmux-agent-indicator/agent-indicator.tmux

# Colours per agent state (pane background, pane border, window title).
set -g @agent-indicator-running-bg 'default'
set -g @agent-indicator-running-border 'yellow'
set -g @agent-indicator-running-window-title-bg 'yellow'
set -g @agent-indicator-running-window-title-fg 'black'
set -g @agent-indicator-needs-input-bg 'default'
set -g @agent-indicator-needs-input-border 'magenta'
set -g @agent-indicator-needs-input-window-title-bg 'magenta'
set -g @agent-indicator-needs-input-window-title-fg 'black'
set -g @agent-indicator-done-bg 'default'
set -g @agent-indicator-done-border 'green'
set -g @agent-indicator-done-window-title-bg 'red'
set -g @agent-indicator-done-window-title-fg 'black'
set -g @agent-indicator-style-active-window 'on'

# Sounds (Ping on needs-input, Glass on done; terminal bell where afplay is missing), no on-screen message.
set -g @agent-indicator-notification-enabled 'on'
set -g @agent-indicator-notification-message 'off'
set -g @agent-indicator-notification-command '~/.tmux/plugins/tmux-agent-indicator/scripts/agent-sound.sh'

# Presence sweep: idle agent windows blue, agent icons and ssh destinations as window labels.
# Runs on every window change (hook index 9 stays clear of the plugin's own hook) and every status refresh.
set-hook -g 'session-window-changed[9]' 'run-shell "~/.tmux/plugins/tmux-agent-indicator/scripts/agent-present.sh sweep"'
set -g status-interval 5
set -g status-right '#(~/.tmux/plugins/tmux-agent-indicator/scripts/agent-present.sh sweep)'
set -g status-left ''

# An ssh window: its active pane runs ssh, or scripts/ssh-reconnect.sh is waiting to reconnect there.
set -g @ssh_window '#{||:#{==:#{pane_current_command},ssh},#{@ssh_reconnect_host}}'
# Window list: agent icon (+ Claude session name after /rename) or ssh destination instead of the
# process name. Ssh windows take the colour of the most urgent agent on that host (published by the
# Hammerspoon module as @ssh_agent_host / @ssh_agent_color).
set -g @ssh_agent_title_style '#{?#{&&:#{E:@ssh_window},#{&&:#{==:#{@agent_label},},#{&&:#{==:#{@ssh_host},#{@ssh_agent_host}},#{@ssh_agent_color}}}},#[bg=#{@ssh_agent_color}#,fg=black#,noreverse],}'
set -g window-status-format '#{E:@ssh_agent_title_style}#I:#{?#{@agent_label},#{@agent_label},#{?#{&&:#{E:@ssh_window},#{@ssh_host}},#{@ssh_host},#W}}#{?window_flags,#{s/-/ /:window_flags}, }'
set -g window-status-current-format '#{E:@ssh_agent_title_style}#I:#{?#{@agent_label},#{@agent_label},#{?#{&&:#{E:@ssh_window},#{@ssh_host}},#{@ssh_host},#W}}#{?window_flags,#{s/-/ /:window_flags}, }'
# Keep the command name while a pane is in copy mode (tmux would show "[tmux]").
set -g automatic-rename-format '#{pane_current_command}#{?pane_dead,[dead],}'

# Ssh windows at the right end of the status bar: tmux's default status-format[0] with the window
# loop duplicated (left loop skips ssh windows, right-aligned loop shows only them).
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#{?#{E:@ssh_window},,#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}}},#{?#{E:@ssh_window},,#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}}#[nolist align=right]#{W:#{?#{E:@ssh_window},#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},},#{?#{E:@ssh_window},#[range=window|#{window_index} #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

run-shell '~/.tmux/plugins/tmux-agent-indicator/scripts/agent-present.sh sweep'

# User customizations, kept across updates.
source-file -q ~/.tmux/agent-indicator.local.conf
